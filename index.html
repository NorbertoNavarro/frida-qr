<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selfie con Frida — The Chronos Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2118; --paper:#F6F1E4; --accent:#3E5C3A; --line: rgba(255,255,255,0.35);
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; font-family:'Inter',sans-serif; }

  #stage{ position:fixed; inset:0; }
  #cam{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; transform:scaleX(-1);
  }
  #three-wrap{ position:absolute; inset:0; width:100%; height:100%; }
  #three-wrap canvas{ display:block; width:100%!important; height:100%!important; touch-action:none; }

  #top-bar{
    position:absolute; top:0; left:0; right:0; padding:18px 18px 0;
    display:flex; align-items:center; justify-content:space-between;
    color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.5);
  }
  .eyebrow{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; opacity:.85; margin:0; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; margin:2px 0 0; }

  #status{
    position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
    text-align:center; color:#fff; padding:0 30px; font-size:13px; line-height:1.6; opacity:.9;
    text-shadow:0 1px 6px rgba(0,0,0,.6);
  }
  #status button{
    margin-top:14px; background:#3E5C3A; color:#fff; border:none; border-radius:999px;
    padding:11px 22px; font-size:13px; font-weight:600; font-family:inherit; letter-spacing:.02em;
  }

  #model-loading{
    position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
    text-align:center; color:#fff; font-size:12px; opacity:.85; text-shadow:0 1px 6px rgba(0,0,0,.6);
  }

  #controls{
    position:absolute; left:0; right:0; bottom:0; padding:16px 16px 22px;
    display:flex; flex-direction:column; gap:10px; align-items:center;
  }
  .hint{ color:#fff; font-size:11px; opacity:.75; text-shadow:0 1px 6px rgba(0,0,0,.6); margin:0 0 2px; }
  .row{ display:flex; gap:10px; }
  .ctrl-btn{
    width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:rgba(0,0,0,0.35); color:#fff; font-size:17px; display:flex;
    align-items:center; justify-content:center; backdrop-filter:blur(6px);
  }
  #shutter{
    width:66px; height:66px; border-radius:50%; border:3px solid #fff;
    background:rgba(255,255,255,0.15); backdrop-filter:blur(6px);
  }
  #shutter::after{
    content:''; display:block; width:52px; height:52px; margin:4px; border-radius:50%; background:#fff;
  }
  #shutter-row{ display:flex; align-items:center; gap:22px; }

  #flash{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; }

  #result{
    position:fixed; inset:0; background:#111; display:none; flex-direction:column;
    align-items:center; justify-content:center; z-index:20;
  }
  #result img{ max-width:92%; max-height:72%; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  #result .row{ margin-top:18px; }
  #result button{
    border:none; border-radius:999px; padding:12px 24px; font-family:inherit; font-weight:600; font-size:13px;
  }
  #dl{ background:#3E5C3A; color:#fff; }
  #close-result{ background:rgba(255,255,255,0.15); color:#fff; }

  #credit{
    position:absolute; right:10px; bottom:8px; font-size:9px; color:#fff; opacity:.55;
    text-shadow:0 1px 4px rgba(0,0,0,.6); max-width:60%; text-align:right; line-height:1.4;
  }

  .hidden{ display:none!important; }
</style>
</head>
<body>

<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <div id="three-wrap"></div>
</div>

<div id="top-bar">
  <div>
    <p class="eyebrow">The Chronos Experience</p>
    <h1>Selfie con Frida</h1>
  </div>
</div>

<div id="status">
  <p>Este filtro usa tu cámara para tomarte una foto junto a un modelo 3D de Frida Kahlo. Necesita permiso de cámara.</p>
  <button id="start-btn">Activar cámara</button>
</div>

<div id="model-loading" class="hidden"><p>Cargando a Frida…</p></div>

<div id="controls" class="hidden">
  <p class="hint">Arrastra la pantalla para acomodar a Frida a tu lado</p>
  <div class="row">
    <div class="ctrl-btn" id="left">←</div>
    <div class="ctrl-btn" id="smaller">−</div>
    <div class="ctrl-btn" id="bigger">+</div>
    <div class="ctrl-btn" id="right">→</div>
  </div>
  <div id="shutter-row">
    <div style="width:42px"></div>
    <div id="shutter"></div>
    <div style="width:42px"></div>
  </div>
</div>

<div id="flash"></div>

<div id="result">
  <img id="result-img" alt="Selfie con Frida">
  <div class="row">
    <button id="close-result">Cerrar</button>
    <button id="dl">Descargar</button>
  </div>
</div>

<div id="credit">Modelo 3D "Frida Crying" por queenawzq (Sketchfab) · CC-BY-4.0</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const video = document.getElementById('cam');
const wrap = document.getElementById('three-wrap');
const statusEl = document.getElementById('status');
const controlsEl = document.getElementById('controls');
const loadingEl = document.getElementById('model-loading');
const startBtn = document.getElementById('start-btn');
const shutter = document.getElementById('shutter');
const flash = document.getElementById('flash');
const resultEl = document.getElementById('result');
const resultImg = document.getElementById('result-img');

// ---------- three.js scene (fondo transparente sobre el video) ----------
const scene = new THREE.Scene();
const camera3 = new THREE.PerspectiveCamera(42, wrap.clientWidth / wrap.clientHeight, 0.01, 40);
camera3.position.set(0, 1.05, 2.6);
camera3.lookAt(0, 0.95, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
wrap.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xfff2df, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 1.3);
key.position.set(1.2, 3, 2.2);
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfeaff, 0.5);
fill.position.set(-2, 1, 1.5);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffe8c9, 0.4);
rim.position.set(0, 2, -2);
scene.add(rim);

// ---------- cargar el modelo real ----------
const fridaGroup = new THREE.Group();
let baseScale = 1;
let loadedModel = null;

const loader = new GLTFLoader();
loader.load('./scene.gltf', (gltf)=>{
  const model = gltf.scene;

  // centrar y escalar el modelo para que quede de tamaño humano de pie
  const box = new THREE.Box3().setFromObject(model);
  const size = new THREE.Vector3();
  box.getSize(size);
  const center = new THREE.Vector3();
  box.getCenter(center);

  const targetHeight = 1.7; // metros aprox, como una persona
  const scaleFactor = targetHeight / (size.y || 1);
  model.scale.setScalar(scaleFactor);

  // recalcular caja tras escalar, para pararlo sobre el "piso" (y=0)
  const box2 = new THREE.Box3().setFromObject(model);
  model.position.x -= (box2.min.x + box2.max.x) / 2;
  model.position.z -= (box2.min.z + box2.max.z) / 2;
  model.position.y -= box2.min.y;

  loadedModel = model;
  fridaGroup.add(model);
  loadingEl.classList.add('hidden');
},
undefined,
(err)=>{
  console.error('Error cargando el modelo:', err);
  loadingEl.innerHTML = '<p>No se pudo cargar el modelo 3D.</p>';
});

fridaGroup.position.set(0.5, -0.85, 0); // a un lado, "parada" junto a ti
scene.add(fridaGroup);

// sombra suave en el piso
const shadowGeo = new THREE.CircleGeometry(0.4, 24);
const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22 });
const shadow = new THREE.Mesh(shadowGeo, shadowMat);
shadow.rotation.x = -Math.PI/2;
shadow.position.set(0, 0.005, 0);
fridaGroup.add(shadow);

// ---------- interacción: arrastrar para mover, botones para escalar/mover ----------
let dragging = false, lastX = 0, lastY = 0;
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

wrap.addEventListener('pointerdown', (e)=>{ dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('pointerup', ()=> dragging = false);
window.addEventListener('pointermove', (e)=>{
  if(!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  fridaGroup.position.x = clamp(fridaGroup.position.x + dx * 0.004, -1.6, 1.6);
  fridaGroup.position.y = clamp(fridaGroup.position.y - dy * 0.003, -1.3, -0.2);
});

document.getElementById('left').addEventListener('click', ()=> fridaGroup.position.x = clamp(fridaGroup.position.x - 0.15, -1.6, 1.6));
document.getElementById('right').addEventListener('click', ()=> fridaGroup.position.x = clamp(fridaGroup.position.x + 0.15, -1.6, 1.6));
document.getElementById('bigger').addEventListener('click', ()=>{ baseScale = clamp(baseScale + 0.08, 0.4, 2.2); fridaGroup.scale.setScalar(baseScale); });
document.getElementById('smaller').addEventListener('click', ()=>{ baseScale = clamp(baseScale - 0.08, 0.4, 2.2); fridaGroup.scale.setScalar(baseScale); });

function onResize(){
  camera3.aspect = wrap.clientWidth / wrap.clientHeight;
  camera3.updateProjectionMatrix();
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
}
window.addEventListener('resize', onResize);

renderer.setAnimationLoop(()=>{
  renderer.render(scene, camera3);
});

// ---------- cámara ----------
async function startCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1080 }, height: { ideal: 1440 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    statusEl.classList.add('hidden');
    controlsEl.classList.remove('hidden');
    loadingEl.classList.remove('hidden');
  }catch(err){
    statusEl.innerHTML = '<p>No se pudo activar la cámara. Revisa los permisos del navegador e inténtalo de nuevo.</p><button id="retry-btn">Reintentar</button>';
    document.getElementById('retry-btn').addEventListener('click', startCamera);
  }
}
startBtn.addEventListener('click', startCamera);

// ---------- captura de foto (video + escena 3D compuestos) ----------
shutter.addEventListener('click', ()=>{
  flash.style.transition = 'none';
  flash.style.opacity = '0.85';
  requestAnimationFrame(()=>{
    flash.style.transition = 'opacity 350ms ease';
    flash.style.opacity = '0';
  });

  const w = wrap.clientWidth, h = wrap.clientHeight;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const ctx = out.getContext('2d');

  ctx.save();
  ctx.translate(w, 0);
  ctx.scale(-1, 1);

  const vw = video.videoWidth, vh = video.videoHeight;
  const videoRatio = vw / vh, canvasRatio = w / h;
  let sx, sy, sw, sh;
  if(videoRatio > canvasRatio){
    sh = vh; sw = vh * canvasRatio; sx = (vw - sw) / 2; sy = 0;
  } else {
    sw = vw; sh = vw / canvasRatio; sx = 0; sy = (vh - sh) / 2;
  }
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
  ctx.restore();

  ctx.drawImage(renderer.domElement, 0, 0, w, h);

  // crédito del modelo, discreto, en la esquina de la foto
  ctx.font = '11px Inter, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.textAlign = 'right';
  ctx.fillText('Modelo 3D "Frida Crying" · queenawzq (Sketchfab) · CC-BY-4.0', w - 12, h - 12);

  resultImg.src = out.toDataURL('image/png');
  resultEl.style.display = 'flex';
});

document.getElementById('close-result').addEventListener('click', ()=>{
  resultEl.style.display = 'none';
});
document.getElementById('dl').addEventListener('click', ()=>{
  const a = document.createElement('a');
  a.href = resultImg.src;
  a.download = 'selfie-con-frida.png';
  a.click();
});
</script>
</body>
</html>
