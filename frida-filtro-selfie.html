<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selfie con Frida — The Chronos Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2118; --paper:#F6F1E4; --accent:#3E5C3A; --line: rgba(255,255,255,0.35);
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; font-family:'Inter',sans-serif; }

  #stage{ position:fixed; inset:0; }
  #cam{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; transform:scaleX(-1); /* efecto espejo, como selfie */
  }
  #three-wrap{ position:absolute; inset:0; width:100%; height:100%; }
  #three-wrap canvas{ display:block; width:100%!important; height:100%!important; touch-action:none; }

  #top-bar{
    position:absolute; top:0; left:0; right:0; padding:18px 18px 0;
    display:flex; align-items:center; justify-content:space-between;
    color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.5);
  }
  .eyebrow{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; opacity:.85; margin:0; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; margin:2px 0 0; }

  #status{
    position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
    text-align:center; color:#fff; padding:0 30px; font-size:13px; line-height:1.6; opacity:.9;
    text-shadow:0 1px 6px rgba(0,0,0,.6);
  }
  #status button{
    margin-top:14px; background:#3E5C3A; color:#fff; border:none; border-radius:999px;
    padding:11px 22px; font-size:13px; font-weight:600; font-family:inherit; letter-spacing:.02em;
  }

  #controls{
    position:absolute; left:0; right:0; bottom:0; padding:16px 16px 22px;
    display:flex; flex-direction:column; gap:10px; align-items:center;
  }
  .hint{ color:#fff; font-size:11px; opacity:.75; text-shadow:0 1px 6px rgba(0,0,0,.6); margin:0 0 2px; }
  .row{ display:flex; gap:10px; }
  .ctrl-btn{
    width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:rgba(0,0,0,0.35); color:#fff; font-size:17px; display:flex;
    align-items:center; justify-content:center; backdrop-filter:blur(6px);
  }
  #shutter{
    width:66px; height:66px; border-radius:50%; border:3px solid #fff;
    background:rgba(255,255,255,0.15); backdrop-filter:blur(6px);
  }
  #shutter::after{
    content:''; display:block; width:52px; height:52px; margin:4px; border-radius:50%; background:#fff;
  }
  #shutter-row{ display:flex; align-items:center; gap:22px; }

  #flash{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; }

  #result{
    position:fixed; inset:0; background:#111; display:none; flex-direction:column;
    align-items:center; justify-content:center; z-index:20;
  }
  #result img{ max-width:92%; max-height:72%; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  #result .row{ margin-top:18px; }
  #result button{
    border:none; border-radius:999px; padding:12px 24px; font-family:inherit; font-weight:600; font-size:13px;
  }
  #dl{ background:#3E5C3A; color:#fff; }
  #close-result{ background:rgba(255,255,255,0.15); color:#fff; }

  .hidden{ display:none!important; }
</style>
</head>
<body>

<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <div id="three-wrap"></div>
</div>

<div id="top-bar">
  <div>
    <p class="eyebrow">The Chronos Experience</p>
    <h1>Selfie con Frida</h1>
  </div>
</div>

<div id="status">
  <p>Este filtro usa tu cámara para tomarte una foto junto a una versión 3D de Frida Kahlo, inspirada en su "Autorretrato con monos". Necesita permiso de cámara.</p>
  <button id="start-btn">Activar cámara</button>
</div>

<div id="controls" class="hidden">
  <p class="hint">Arrastra la pantalla para acomodar a Frida a tu lado</p>
  <div class="row">
    <div class="ctrl-btn" id="left">←</div>
    <div class="ctrl-btn" id="smaller">−</div>
    <div class="ctrl-btn" id="bigger">+</div>
    <div class="ctrl-btn" id="right">→</div>
  </div>
  <div id="shutter-row">
    <div style="width:42px"></div>
    <div id="shutter"></div>
    <div style="width:42px"></div>
  </div>
</div>

<div id="flash"></div>

<div id="result">
  <img id="result-img" alt="Selfie con Frida">
  <div class="row">
    <button id="close-result">Cerrar</button>
    <button id="dl">Descargar</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const video = document.getElementById('cam');
const wrap = document.getElementById('three-wrap');
const statusEl = document.getElementById('status');
const controlsEl = document.getElementById('controls');
const startBtn = document.getElementById('start-btn');
const shutter = document.getElementById('shutter');
const flash = document.getElementById('flash');
const resultEl = document.getElementById('result');
const resultImg = document.getElementById('result-img');

// ---------- three.js scene (fondo transparente sobre el video) ----------
const scene = new THREE.Scene();
const camera3 = new THREE.PerspectiveCamera(42, wrap.clientWidth / wrap.clientHeight, 0.01, 20);
camera3.position.set(0, 1.05, 2.4);
camera3.lookAt(0, 0.85, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.setClearColor(0x000000, 0);
wrap.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xfff2df, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 1.15);
key.position.set(1.2, 3, 2.2);
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfeaff, 0.45);
fill.position.set(-2, 1, 1.5);
scene.add(fill);

// ---------- helpers ----------
function leafShape(len, w){
  const s = new THREE.Shape();
  s.moveTo(0,0);
  s.quadraticCurveTo(w, len*0.35, 0, len);
  s.quadraticCurveTo(-w, len*0.35, 0, 0);
  return s;
}
function makeLeaf(len, w, color){
  const geo = new THREE.ExtrudeGeometry(leafShape(len, w), { depth: 0.012, bevelEnabled: false });
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7, side: THREE.DoubleSide });
  return new THREE.Mesh(geo, mat);
}
function makeMonkey(color){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), new THREE.MeshStandardMaterial({ color, roughness: 0.8 }));
  body.scale.set(1, 1.3, 0.9);
  g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), new THREE.MeshStandardMaterial({ color, roughness: 0.8 }));
  head.position.set(0, 0.12, 0.02);
  g.add(head);
  [[-0.05,0.15],[0.05,0.15]].forEach(([x,y])=>{
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.02, 10, 10), new THREE.MeshStandardMaterial({ color, roughness: 0.8 }));
    ear.position.set(x, y, 0.02);
    g.add(ear);
  });
  const tailCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0,-0.04,-0.06),
    new THREE.Vector3(0.04,0.04,-0.13),
    new THREE.Vector3(0.015,0.13,-0.11)
  ]);
  const tail = new THREE.Mesh(new THREE.TubeGeometry(tailCurve, 20, 0.012, 8, false), new THREE.MeshStandardMaterial({ color, roughness: 0.8 }));
  g.add(tail);
  return g;
}

// ---------- figura de Frida, de cuerpo entero, estilo autorretrato ----------
const frida = new THREE.Group();

// follaje detrás, como en sus autorretratos
const leafColors = [0x3E5C3A, 0x4C7248, 0x2E4A2C];
for(let i=0;i<10;i++){
  const leaf = makeLeaf(0.55 + Math.random()*0.35, 0.16 + Math.random()*0.08, leafColors[i % leafColors.length]);
  leaf.position.set((Math.random()-0.5)*0.9, 1.1 + Math.random()*1.0, -0.32 - Math.random()*0.2);
  leaf.rotation.z = (Math.random()-0.5) * 1.4;
  leaf.rotation.y = (Math.random()-0.5) * 0.6;
  frida.add(leaf);
}

// falda / vestido tehuano, de pie
const skirtMat = new THREE.MeshStandardMaterial({ color: 0xA23324, roughness: 0.75 });
const skirt = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.36, 0.95, 24), skirtMat);
skirt.position.set(0, 0.5, 0);
frida.add(skirt);

// blusa/huipil
const bloseMat = new THREE.MeshStandardMaterial({ color: 0xF4F1E6, roughness: 0.7 });
const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.23, 0.5, 20), bloseMat);
torso.position.set(0, 1.16, 0);
frida.add(torso);

const skin = new THREE.MeshStandardMaterial({ color: 0xE8C39E, roughness: 0.6 });

// brazos simples
[[-1,-0.18],[1,0.18]].forEach(([side, rz])=>{
  const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.045, 0.42, 4, 8), skin);
  arm.position.set(side*0.24, 1.02, 0.02);
  arm.rotation.z = rz;
  frida.add(arm);
});

const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.075, 0.12, 16), skin);
neck.position.set(0, 1.45, 0);
frida.add(neck);

const head = new THREE.Mesh(new THREE.SphereGeometry(0.145, 24, 24), skin);
head.position.set(0, 1.62, 0);
frida.add(head);

const hair = new THREE.Mesh(
  new THREE.SphereGeometry(0.155, 24, 24, 0, Math.PI*2, 0, Math.PI*0.62),
  new THREE.MeshStandardMaterial({ color: 0x1E140D, roughness: 0.55 })
);
hair.position.set(0, 1.635, 0);
frida.add(hair);

// corona de flores
const flowerColors = [0xD99A2B, 0xA23324, 0xE07B39];
for(let i=0;i<10;i++){
  const a = (i / 10) * Math.PI * 2;
  const petal = new THREE.Mesh(new THREE.SphereGeometry(0.023, 10, 10), new THREE.MeshStandardMaterial({ color: flowerColors[i % flowerColors.length], roughness: 0.6 }));
  petal.position.set(Math.cos(a)*0.14, 1.75 + Math.sin(a*3)*0.012, Math.sin(a)*0.14);
  frida.add(petal);
}

// changos sobre los hombros, como en el cuadro
const m1 = makeMonkey(0x3B2A1E);
m1.position.set(-0.26, 1.42, 0.1);
m1.rotation.y = 0.5;
frida.add(m1);

const m2 = makeMonkey(0x4A3324);
m2.position.set(0.26, 1.45, 0.1);
m2.rotation.y = -0.5;
frida.add(m2);

// sombra suave en el piso
const shadowGeo = new THREE.CircleGeometry(0.32, 24);
const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22 });
const shadow = new THREE.Mesh(shadowGeo, shadowMat);
shadow.rotation.x = -Math.PI/2;
shadow.position.set(0, 0.02, 0);
frida.add(shadow);

frida.position.set(0.55, -0.55, 0); // a un lado, como si estuviera parada junto a ti
scene.add(frida);

// ---------- interacción: arrastrar para mover, botones para escalar/mover ----------
let dragging = false, lastX = 0, lastY = 0;
let baseScale = 1;

function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

wrap.addEventListener('pointerdown', (e)=>{ dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('pointerup', ()=> dragging = false);
window.addEventListener('pointermove', (e)=>{
  if(!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  frida.position.x = clamp(frida.position.x + dx * 0.004, -1.4, 1.4);
  frida.position.y = clamp(frida.position.y - dy * 0.003, -0.9, -0.1);
});

document.getElementById('left').addEventListener('click', ()=> frida.position.x = clamp(frida.position.x - 0.15, -1.4, 1.4));
document.getElementById('right').addEventListener('click', ()=> frida.position.x = clamp(frida.position.x + 0.15, -1.4, 1.4));
document.getElementById('bigger').addEventListener('click', ()=>{ baseScale = clamp(baseScale + 0.08, 0.5, 1.8); frida.scale.setScalar(baseScale); });
document.getElementById('smaller').addEventListener('click', ()=>{ baseScale = clamp(baseScale - 0.08, 0.5, 1.8); frida.scale.setScalar(baseScale); });

function onResize(){
  camera3.aspect = wrap.clientWidth / wrap.clientHeight;
  camera3.updateProjectionMatrix();
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
}
window.addEventListener('resize', onResize);

renderer.setAnimationLoop(()=>{
  renderer.render(scene, camera3);
});

// ---------- cámara ----------
async function startCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1080 }, height: { ideal: 1440 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    statusEl.classList.add('hidden');
    controlsEl.classList.remove('hidden');
  }catch(err){
    statusEl.innerHTML = '<p>No se pudo activar la cámara. Revisa los permisos del navegador e inténtalo de nuevo.</p><button id="retry-btn">Reintentar</button>';
    document.getElementById('retry-btn').addEventListener('click', startCamera);
  }
}
startBtn.addEventListener('click', startCamera);

// ---------- captura de foto (video + escena 3D compuestos) ----------
shutter.addEventListener('click', ()=>{
  flash.style.transition = 'none';
  flash.style.opacity = '0.85';
  requestAnimationFrame(()=>{
    flash.style.transition = 'opacity 350ms ease';
    flash.style.opacity = '0';
  });

  const w = wrap.clientWidth, h = wrap.clientHeight;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const ctx = out.getContext('2d');

  // dibuja el video en espejo (como se ve en pantalla)
  ctx.save();
  ctx.translate(w, 0);
  ctx.scale(-1, 1);

  const vw = video.videoWidth, vh = video.videoHeight;
  const videoRatio = vw / vh, canvasRatio = w / h;
  let sx, sy, sw, sh;
  if(videoRatio > canvasRatio){
    sh = vh; sw = vh * canvasRatio; sx = (vw - sw) / 2; sy = 0;
  } else {
    sw = vw; sh = vw / canvasRatio; sx = 0; sy = (vh - sh) / 2;
  }
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
  ctx.restore();

  // dibuja la escena 3D encima (ya está renderizada, sin espejo, porque queda fija en pantalla)
  ctx.drawImage(renderer.domElement, 0, 0, w, h);

  resultImg.src = out.toDataURL('image/png');
  resultEl.style.display = 'flex';
});

document.getElementById('close-result').addEventListener('click', ()=>{
  resultEl.style.display = 'none';
});
document.getElementById('dl').addEventListener('click', ()=>{
  const a = document.createElement('a');
  a.href = resultImg.src;
  a.download = 'selfie-con-frida.png';
  a.click();
});
</script>
</body>
</html>
