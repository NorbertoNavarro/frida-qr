<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frida en AR — The Chronos Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  :root{ --paper:#F6F1E4; --ink:#2B2118; --line: rgba(43,33,24,0.16); }
  *{ box-sizing:border-box; }
  html, body{ margin:0; height:100%; overflow:hidden; font-family:'Inter',sans-serif; color:var(--ink); }
  a-scene{ width:100%; height:100%; }

  .bar{
    position:fixed; left:0; right:0; z-index:20;
    padding:14px 18px; background:rgba(246,241,228,0.92);
    backdrop-filter:blur(4px);
  }
  .top{ top:0; border-bottom:1px solid var(--line); }
  .bottom{ bottom:0; border-top:1px solid var(--line); text-align:center; }
  .eyebrow{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; opacity:.6; margin:0 0 4px; }
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size:18px; margin:0; }
  .bottom p{ font-size:12px; opacity:.7; margin:0; line-height:1.5; }
</style>
</head>
<body>

<div class="bar top">
  <p class="eyebrow">The Chronos Experience</p>
  <h1>Apunta al cuadro: Autorretrato con monos</h1>
</div>

<div class="bar bottom">
  <p>Encuadra el cuadro completo, con buena luz y sin reflejos, hasta que el contenido aparezca sobre él.</p>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <!-- corona de flores flotando sobre el cuadro -->
    <a-entity id="crown" position="0 0.55 0.05"
      animation="property: position; dir: alternate; dur: 1800; loop: true; to: 0 0.62 0.05; easing: easeInOutSine">
      <a-sphere radius="0.035" color="#D99A2B" position="0.30 0 0"></a-sphere>
      <a-sphere radius="0.035" color="#A23324" position="0.21 0.06 0.06"></a-sphere>
      <a-sphere radius="0.035" color="#E07B39" position="0.10 0.10 0.10"></a-sphere>
      <a-sphere radius="0.038" color="#D99A2B" position="0 0.12 0.11"></a-sphere>
      <a-sphere radius="0.035" color="#A23324" position="-0.10 0.10 0.10"></a-sphere>
      <a-sphere radius="0.035" color="#E07B39" position="-0.21 0.06 0.06"></a-sphere>
      <a-sphere radius="0.035" color="#D99A2B" position="-0.30 0 0"></a-sphere>
    </a-entity>

    <!-- mono a la izquierda -->
    <a-entity position="-0.62 -0.05 0.08" rotation="0 35 0"
      animation="property: rotation; dir: alternate; dur: 2200; loop: true; to: 0 55 0; easing: easeInOutSine">
      <a-sphere radius="0.09" color="#3B2A1E" scale="1 1.3 0.9"></a-sphere>
      <a-sphere radius="0.06" color="#3B2A1E" position="0 0.12 0.02"></a-sphere>
      <a-sphere radius="0.02" color="#3B2A1E" position="-0.05 0.16 0.02"></a-sphere>
      <a-sphere radius="0.02" color="#3B2A1E" position="0.05 0.16 0.02"></a-sphere>
    </a-entity>

    <!-- mono a la derecha -->
    <a-entity position="0.62 -0.05 0.08" rotation="0 -35 0"
      animation="property: rotation; dir: alternate; dur: 2400; loop: true; to: 0 -55 0; easing: easeInOutSine">
      <a-sphere radius="0.09" color="#4A3324" scale="1 1.3 0.9"></a-sphere>
      <a-sphere radius="0.06" color="#4A3324" position="0 0.12 0.02"></a-sphere>
      <a-sphere radius="0.02" color="#4A3324" position="-0.05 0.16 0.02"></a-sphere>
      <a-sphere radius="0.02" color="#4A3324" position="0.05 0.16 0.02"></a-sphere>
    </a-entity>

    <!-- etiqueta con el título -->
    <a-entity position="0 -0.62 0.05">
      <a-plane width="0.62" height="0.13" color="#2B2118" opacity="0.82"></a-plane>
      <a-text value="Autorretrato con monos, 1943" align="center" width="1.1" color="#F6F1E4" position="0 0 0.01"></a-text>
    </a-entity>

  </a-entity>
</a-scene>

</body>
</html>
