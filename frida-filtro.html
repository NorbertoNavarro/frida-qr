<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Filtro AR: Frida Kahlo a tu Lado</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0d0e12; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ocultamos el elemento HTML video para usarlo como buffer */
    #input_video { display: none; }

    /* Canvas 3D overlay */
    #output_canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Overlay de carga */
    #loader {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 14, 18, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #d4af37;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .instructions {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      font-size: 13px;
      color: #e0e0e0;
      z-index: 20;
      text-align: center;
      pointer-events: none;
    }
  </style>

  <!-- Librerías desde CDNs Globales para GitHub Pages -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="container">
  <div id="loader">
    <div class="spinner"></div>
    <p>Iniciando cámara y detección facial...</p>
  </div>

  <video id="input_video" playsinline></video>
  <canvas id="output_canvas"></canvas>

  <div class="instructions">
    ✨ Muévete en pantalla: Frida se parará siempre a tu lado derecho.
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const videoElement = document.getElementById('input_video');
const canvasElement = document.getElementById('output_canvas');
const loader = document.getElementById('loader');

// ---- 1. Configuración de Escena Three.js ----
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

// Luces
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(2, 4, 3);
scene.add(dirLight);

// Piano de Fondo con la textura de la Webcam
const videoTexture = new THREE.VideoTexture(videoElement);
videoTexture.colorSpace = THREE.SRGBColorSpace;
const videoGeo = new THREE.PlaneGeometry(1, 1);
const videoMat = new THREE.MeshBasicMaterial({ map: videoTexture });
const videoMesh = new THREE.Mesh(videoGeo, videoMat);
videoMesh.position.z = -2;
scene.add(videoMesh);

// ---- 2. Modelo 3D Estilizado de Frida Kahlo ----
function buildFrida() {
  const group = new THREE.Group();

  // Busto/Vestido
  const dress = new THREE.Mesh(
    new THREE.CylinderGeometry(0.28, 0.38, 0.8, 24),
    new THREE.MeshStandardMaterial({ color: 0xC2185B, roughness: 0.6 })
  );
  dress.position.y = -0.5;
  group.add(dress);

  // Rebozo
  const shawl = new THREE.Mesh(
    new THREE.TorusGeometry(0.3, 0.07, 12, 24, Math.PI * 1.2),
    new THREE.MeshStandardMaterial({ color: 0x00838F, roughness: 0.5 })
  );
  shawl.rotation.x = Math.PI / 2;
  shawl.position.set(0, -0.18, 0.04);
  group.add(shawl);

  // Cabeza
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 32, 32),
    new THREE.MeshStandardMaterial({ color: 0xEDB88B, roughness: 0.5 })
  );
  head.scale.set(1, 1.15, 0.95);
  group.add(head);

  // Uniceja
  const browShape = new THREE.Shape();
  browShape.moveTo(-0.1, 0); browShape.quadraticCurveTo(-0.02, 0.03, 0, -0.01);
  browShape.quadraticCurveTo(0.02, 0.03, 0.1, 0);
  const brow = new THREE.Mesh(
    new THREE.ShapeGeometry(browShape),
    new THREE.MeshBasicMaterial({ color: 0x0a0807, side: THREE.DoubleSide })
  );
  brow.position.set(0, 0.05, 0.22);
  group.add(brow);

  // Corona de Flores
  const flowerColors = [0xE91E63, 0xFF9800, 0x9C27B0, 0xF44336];
  for (let i = 0; i < 5; i++) {
    const angle = (i / 4) * Math.PI - Math.PI / 2;
    const flower = new THREE.Mesh(
      new THREE.SphereGeometry(0.05, 12, 12),
      new THREE.MeshStandardMaterial({ color: flowerColors[i % flowerColors.length] })
    );
    flower.position.set(Math.sin(angle) * 0.18, 0.22 + Math.cos(angle * 2) * 0.02, Math.cos(angle) * 0.12);
    group.add(flower);
  }

  group.scale.setScalar(1.2);
  return group;
}

const frida = buildFrida();
frida.visible = false;
scene.add(frida);

// ---- 3. Integración MediaPipe FaceMesh ----
function onResults(results) {
  // Ajustar plano de video de fondo
  if (videoElement.videoWidth && videoElement.videoHeight) {
    const aspect = videoElement.videoWidth / videoElement.videoHeight;
    videoMesh.scale.set(4 * aspect, 4, 1);
  }

  // Ocultar pantalla de carga en primera detección exitosa
  if (loader.style.opacity !== '0') {
    loader.style.opacity = '0';
    setTimeout(() => loader.style.display = 'none', 400);
  }

  if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    const landmarks = results.multiFaceLandmarks[0];
    
    // Punto de referencia 1 = Punta de la Nariz
    const nose = landmarks[1];

    // Convertir de coordenadas de pantalla (0 a 1) a espacio 3D de Three.js
    const targetX = -(nose.x - 0.5) * 3.8; 
    const targetY = -(nose.y - 0.5) * 2.8;

    frida.visible = true;

    // Desplazamiento: Frida se coloca ligada a la persona (+0.8 a su derecha)
    frida.position.x = targetX + 0.85;
    frida.position.y = targetY - 0.2;
    frida.position.z = -0.5;

    // Giro ligero hacia la cara
    frida.rotation.y = -0.25;
  } else {
    frida.visible = false;
  }

  renderer.render(scene, camera);
}

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: false,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(onResults);

// Cámara usando MediaPipe CameraUtils
const cameraFeed = new Camera(videoElement, {
  onFrame: async () => {
    await faceMesh.send({ image: videoElement });
  },
  width: 1280,
  height: 720
});

cameraFeed.start();

// Redimensionar ventana
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
